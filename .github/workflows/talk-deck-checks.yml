name: HTML Talk Deck checks
on:
  pull_request:
    paths: ['lessons/**', 'lessons.html', 'scripts/**', 'package.json', 'bun.lock', '.github/workflows/**', '.claude/skills/talk-deck/**']
  push:
    paths: ['lessons/**', 'lessons.html', 'scripts/**', 'package.json', 'bun.lock', '.github/workflows/**', '.claude/skills/talk-deck/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Check catalog and changed decks
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            python3 scripts/check-talk-decks.py --base "$BASE_REF"
          else
            python3 scripts/check-talk-decks.py
          fi
          python3 -m unittest discover -s scripts/tests -v
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - name: Build shared HTML template
        working-directory: lessons/_template
        run: bun install --frozen-lockfile && bun run build
      - name: Verify browser behavior and three presentation sizes
        env:
          DECK_URL: http://127.0.0.1:5196/
        run: |
          bun run --cwd lessons/_template dev --host 127.0.0.1 --port 5196 > /tmp/deck-vite.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail "$DECK_URL" && break || sleep 1; done
          bun run scripts/test-deck-runtime.mjs
          bun run qa:deck -- --url "$DECK_URL" --output-dir out/qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: talk-deck-browser-qa
          path: out/qa
