name: Deploy SEO GEO Course
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-seo-geo-course
  cancel-in-progress: false
jobs:
  verify-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.SERVICE_CI_RUNNER_LABELS) }}
    steps:
      - name: Require independent Mac CI
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          case "${RUNNER_NAME:-}" in lightman-mac-studio-*) ;; *) echo 'Service builds require the existing independent Mac CI' >&2; exit 1 ;; esac
          case "$(uname -s)" in
            Darwin) test "$(sysctl -n hw.model)" = Mac13,1 ;;
            Linux) test "$(uname -m)" = aarch64 ;;
            *) exit 1 ;;
          esac
          case "${BUILDKIT_HOST:-}" in ''|unix://*) ;; *) echo 'Remote BuildKit is forbidden' >&2; exit 1 ;; esac
          if command -v docker >/dev/null 2>&1; then
            endpoint="${DOCKER_HOST:-}"
            if [ -n "${DOCKER_CONTEXT:-}" ] || [ -z "$endpoint" ]; then
              endpoint=$(docker context inspect ${DOCKER_CONTEXT:+"$DOCKER_CONTEXT"} --format '{{.Endpoints.docker.Host}}')
            fi
            case "$endpoint" in unix://*|tcp://docker:2376) ;; *) echo 'Production/remote Docker is forbidden' >&2; exit 1 ;; esac
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build only SEO GEO course
        working-directory: lessons/founder-seo-eeat
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Assemble course and catalog
        run: |
          mkdir -p _seo_site/lessons/founder-seo-eeat
          cp -r lessons/founder-seo-eeat/dist/. _seo_site/lessons/founder-seo-eeat/
          cp lessons/founder-seo-eeat/*.md _seo_site/lessons/founder-seo-eeat/
          cp lessons.html _seo_site/lessons.html
          node -e "require('fs').writeFileSync('_seo_site/lessons/founder-seo-eeat/release.json',JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,course:'founder-seo-eeat',builtAt:new Date().toISOString()},null,2))"
          cp _seo_site/lessons/founder-seo-eeat/release.json "_seo_site/lessons/founder-seo-eeat/release-${GITHUB_SHA}.json"
          node scripts/check-curriculum-domain.mjs _seo_site
      - name: Install browser QA dependencies
        run: bun install --frozen-lockfile
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Verify built course at its production subpath
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p _seo_host
          ln -s "$GITHUB_WORKSPACE/_seo_site" _seo_host/curriculum
          python3 -m http.server 8808 --directory _seo_host > /tmp/seo-preview-server.log 2>&1 &
          for attempt in {1..15}; do curl --fail --silent http://127.0.0.1:8808/curriculum/lessons.html >/dev/null && break; sleep 1; done
          node scripts/verify-seo-release.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: seo-course-publication
          path: _seo_site/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: seo-course-build-qa
          path: seo-release-qa/
          retention-days: 7
  deploy:
    needs: verify-build
    runs-on: ${{ fromJSON(vars.SERVICE_CI_RUNNER_LABELS) }}
    steps:
      - name: Require independent Mac CI
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          case "${RUNNER_NAME:-}" in lightman-mac-studio-*) ;; *) echo 'Service builds require the existing independent Mac CI' >&2; exit 1 ;; esac
          case "$(uname -s)" in
            Darwin) test "$(sysctl -n hw.model)" = Mac13,1 ;;
            Linux) test "$(uname -m)" = aarch64 ;;
            *) exit 1 ;;
          esac
          case "${BUILDKIT_HOST:-}" in ''|unix://*) ;; *) echo 'Remote BuildKit is forbidden' >&2; exit 1 ;; esac
          if command -v docker >/dev/null 2>&1; then
            endpoint="${DOCKER_HOST:-}"
            if [ -n "${DOCKER_CONTEXT:-}" ] || [ -z "$endpoint" ]; then
              endpoint=$(docker context inspect ${DOCKER_CONTEXT:+"$DOCKER_CONTEXT"} --format '{{.Endpoints.docker.Host}}')
            fi
            case "$endpoint" in unix://*|tcp://docker:2376) ;; *) echo 'Production/remote Docker is forbidden' >&2; exit 1 ;; esac
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seo-course-publication
          path: _seo_site
      - name: Publish only SEO course and catalog
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: '_seo_site/*'
          target: '/var/www/static/curriculum'
          strip_components: 1
          overwrite: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install public browser verification dependencies
        run: bun install --frozen-lockfile
      - id: public-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Read public deployment in real Chrome
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CHROME_PATH: ${{ steps.public-chrome.outputs.chrome-path }}
          SEO_BASE_URL: https://jracademy.ai/curriculum/lessons/founder-seo-eeat/
          SEO_QA_OUT: seo-live-qa
        run: |
          curl --location --silent --show-error --max-time 30 --output /tmp/seo-curl-probe.json --write-out 'Public curl diagnostic: status=%{http_code} bytes=%{size_download} redirects=%{num_redirects}\n' "https://jracademy.ai/curriculum/lessons/founder-seo-eeat/release-${EXPECTED_SHA}.json" || true
          node scripts/verify-seo-release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-course-public-browser-qa
          path: seo-live-qa/
          retention-days: 7
