<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第七期大纲 · 本地审核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf7f1;color:#17203b;font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:1160px;margin:auto;padding:36px 24px}h1{font-size:34px;line-height:1.2;margin:10px 0}header p{color:#596175}.bar{position:sticky;top:0;background:#faf7f1f5;padding:16px 0;display:flex;flex-wrap:wrap;gap:10px;z-index:2}input,select{font:inherit;padding:10px 14px;border:1px solid #d9d5ce;border-radius:12px;background:white}input{flex:1;min-width:210px}article{background:white;border:1px solid #e3ded6;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 5px 20px #17203b05}h2{font-size:21px;line-height:1.4;margin:9px 0}.meta{font-size:13px;color:#645180}.desc{margin:8px 0;color:#454e65}summary{cursor:pointer;font-weight:650;padding:8px 0;color:#4a3c86}.body{border-top:1px solid #eee;padding-top:15px;overflow-wrap:anywhere}.body h1{font-size:25px}.body h2{font-size:22px}.body h3{font-size:18px}.body pre{white-space:pre-wrap;background:#f4f4f8;padding:14px;overflow:auto}.body table{display:block;overflow:auto;border-collapse:collapse}.body td,.body th{padding:8px;border:1px solid #ddd}li{margin:7px 0}.badge{display:inline-block;background:#f0ebff;color:#503b85;padding:3px 9px;border-radius:20px;margin-right:6px}.note{background:#fff0e8;border-radius:12px;padding:12px 16px}#count{font-weight:650}a{color:#5340a0}@media(max-width:600px){main{padding:22px 14px}h1{font-size:28px}article{padding:17px}}
</style>
<main><header><div>JR ACADEMY / CURRICULUM REVIEW</div><h1>AI Engineer 第七期课程大纲</h1><p>本地审核版 · 直接读取 outline.json · 不是旧 PDF 或宣传文案副本</p><div class="note">已确认课程与材料制作状态分开查看。候选包含选修和参考，不等于必修数量；历史排除条目默认隐藏。</div><p id="stats">读取中…</p></header>
<div class="bar"><input id="q" placeholder="搜索课程、技术或正文" aria-label="搜索"><select id="kind" aria-label="类型"><option value="all">全部当前候选</option><option value="live">正式 Live</option><option value="Video">录播</option><option value="InteractiveLab">Lab</option><option value="Information">参考资料</option><option value="excluded">已排除（历史）</option></select><select id="week" aria-label="周次"><option value="all">全部周次</option></select></div><div id="count"></div><section id="list"></section></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let lessons=[];
const params=new URLSearchParams(location.search);$('#q').value=params.get('q')||'';if([...$('#kind').options].some(o=>o.value===params.get('kind')))$('#kind').value=params.get('kind');
for(let i=1;i<=13;i++)$('#week').add(new Option('W'+i,String(i)));$('#week').value=params.get('week')||'all';
function render(){const q=$('#q').value.toLowerCase(),kind=$('#kind').value,week=$('#week').value;const p=new URLSearchParams();if(q)p.set('q',$('#q').value);if(kind!=='all')p.set('kind',kind);if(week!=='all')p.set('week',week);history.replaceState(null,'',location.pathname+(p.size?'?'+p:''));const selected=lessons.filter(l=>(kind==='excluded'?l.cohort7Included===false:l.cohort7Included!==false)&&(kind==='all'||kind==='excluded'||(kind==='live'?l.isLive:l.type===kind))&&(week==='all'||String(l.cohort7Week)===week)&&(!q||JSON.stringify(l).toLowerCase().includes(q))).sort((a,b)=>(a.cohort7Week||99)-(b.cohort7Week||99)||(a.cohort7SessionOrder||999)-(b.cohort7SessionOrder||999));$('#count').textContent=selected.length+' 条匹配';$('#list').innerHTML=selected.map(l=>`<article><div class="meta"><span class="badge">${l.isLive?(l.cohort7Track==='theory'?'理论 Live':'实践 Live'):esc(l.type)}</span>${esc(l.cohort7Week?'W'+l.cohort7Week:'未指定周次 / 参考池')} · ${esc(l.code)} · ${esc(l.phase)}</div><h2>${esc(l.title)}</h2><p class="desc">${esc(l.description)}</p><details><summary>课堂内容与教学步骤</summary><ol>${(l.steps||[]).map(s=>`<li><strong>${esc(s.title)}</strong><br>${esc(s.description)}</li>`).join('')}</ol></details><details><summary>完整教学正文</summary><div class="body">${l.learningMaterial||'<p>暂无正文</p>'}</div></details><details><summary>英文说明 / 前置 / 制作状态</summary><p>${esc(l.description_en)}</p><p>前置：${esc((l.cohort7Prerequisites||[]).join('、')||'未单独标注')}</p><p>状态：${esc(l.cohort7Status||'尚未统一标注')} / ${esc(l.cohort7MaterialStatus||l.cohort7ModelMigrationStatus||'材料就绪情况待核验')}</p><p>${esc(l.cohort7Decision||l.cohort7Readiness?.reason||'')}</p></details></article>`).join('')||'<p>没有匹配条目。</p>';}
fetch('./outline.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(o=>{lessons=o.phases.flatMap(p=>p.lessons.map(l=>({...l,phase:p.name})));$('#stats').textContent=`当前候选 ${lessons.filter(l=>l.cohort7Included!==false).length} 条 · 正式 Live ${lessons.filter(l=>l.isLive&&l.cohort7Included!==false).length} 场 · 历史记录 ${lessons.length} 条`;render()}).catch(e=>$('#stats').textContent='读取失败：'+e.message);for(const id of ['q','kind','week'])$('#'+id).addEventListener(id==='q'?'input':'change',render);
</script></html>
