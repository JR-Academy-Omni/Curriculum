<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="googlebot" content="noindex,nofollow"><title>护理记录 · API 实操</title><link rel="stylesheet" href="materials/craft.css"><style>
main{max-width:1240px}.workspace{display:grid;grid-template-columns:1fr 1.2fr;gap:24px}.workspace h2{margin-top:0}label{display:block;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;font:inherit;border:1px solid var(--jc-hairline);border-radius:14px;background:var(--jc-canvas-pure);color:var(--jc-ink)}textarea{min-height:145px}button{font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar label{margin:0}#status{padding:14px 0;min-height:48px}#status[data-error=true]{color:var(--jc-danger)}#list{display:grid;gap:10px}#list button{text-align:left;border-radius:14px;border:1px solid var(--jc-hairline);padding:14px;background:var(--jc-surface);color:var(--jc-ink)}pre{overflow:auto;max-height:360px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}details{margin:22px 0}summary{cursor:pointer;font-weight:700}#detail{white-space:pre-wrap;line-height:1.8}#dirty{color:var(--jc-slate);font-size:14px}#api-body{font-family:var(--jc-font-mono)}@media(max-width:760px){.workspace{grid-template-columns:1fr}}
</style><main><header><div class="eyebrow">AI ENGINEER · API WORKSPACE</div><h1>护理记录 · API 实操</h1><p>查看完整记录，提交一条新记录，再跟踪请求与返回结果。</p><nav><a href="materials/handbook.html">完整讲义</a> · <a href="materials/worksheet.html">课堂工作单</a></nav></header>
<section class="toolbar card"><label for="fault">Exercise case</label><select id="fault" style="width:auto"><option value="normal">Normal request</option><option value="bad-body">Invalid field name</option><option value="no-session">Missing session</option><option value="viewer">Read-only role</option><option value="wrong-url">Incorrect API path</option></select><button id="reset" class="secondary">Reset workspace</button></section>
<div class="workspace"><section class="card"><h2>记录列表</h2><div id="list"></div><h2 style="margin-top:28px">完整记录</h2><article id="detail" aria-live="polite"></article></section><section class="card"><h2>新增护理记录</h2><form id="form"><label for="resident">对象</label><input id="resident" value="resident-001" readonly><label for="activity">护理活动</label><input id="activity" value="Afternoon check-in" maxlength="100" required><label for="note">观察、处理与后续事项</label><textarea id="note" maxlength="2000" required>14:00 — 住户表示安静区域更适合休息。已记录其环境偏好并告知当班人员。后续由下一班次继续询问并记录反馈。</textarea><p id="dirty">尚未提交</p><button class="primary" id="save">保存记录</button></form><div id="status" role="status" aria-live="polite"></div></section></div>
<details open class="card"><summary>请求与响应</summary><pre id="trace">打开记录以查看请求。</pre></details>
<details class="card"><summary>API request panel</summary><p>Send a request independently of the record form.</p><label for="method">Method</label><select id="method"><option>GET</option><option>POST</option></select><label for="path">Path</label><input id="path" value="/api/notes"><label for="api-body">JSON body</label><textarea id="api-body">{"residentId":"resident-001","activity":"Evening check-in","note":"Resident requested the reading light. Preference recorded for the next shift."}</textarea><button id="send" class="primary" type="button">Send request</button><pre id="api-result"></pre></details>
<details class="card"><summary>请求日志</summary><button id="logs" class="secondary">读取日志</button><pre id="log-result"></pre></details>
</main><script>
const $=s=>document.querySelector(s);let busy=false,dirty=false;
function status(t,error=false){$('#status').textContent=t;$('#status').dataset.error=error}
async function request(path,method='GET',body,credentials='same-origin'){
 const r=await fetch(path,{method,credentials,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();const trace={method,path,requestBody:body??null,status:r.status,requestId:r.headers.get('X-Request-ID'),response:data};$('#trace').textContent=JSON.stringify(trace,null,2);return {r,data,trace};
}
function detail(n){$('#detail').textContent=`${n.activity}\n对象：${n.residentId}\n记录 ID：${n.id}\n时间：${n.createdAt}\n\n${n.note}`;const u=new URL(location);u.searchParams.set('note',n.id);history.replaceState({},'',u)}
async function load(id){const {r,data}=await request('/api/notes');if(!r.ok)throw Error(data.error.message);$('#list').replaceChildren();data.items.forEach(n=>{const b=document.createElement('button');b.type='button';b.textContent=n.activity;b.onclick=async()=>{try{const x=await request('/api/notes/'+encodeURIComponent(n.id));if(!x.r.ok)throw Error(x.data.error.message);detail(x.data)}catch(e){status(e.message,true)}};$('#list').append(b)});if(!data.items.length){$('#detail').textContent='暂无记录';return}const target=id||new URL(location).searchParams.get('note')||data.items[0].id;const x=await request('/api/notes/'+encodeURIComponent(target));if(x.r.ok)detail(x.data);else{detail(data.items[0]);status('该记录不存在，已打开当前记录。',true)}}
$('#form').oninput=()=>{dirty=true;$('#dirty').textContent='有未提交的修改'};
$('#form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('#save').disabled=true;status('正在保存…');try{
const fault=$('#fault').value;await request('/api/role','POST',{role:fault==='viewer'?'viewer':'editor'});let body={residentId:$('#resident').value,activity:$('#activity').value,note:$('#note').value};if(fault==='bad-body'){body.notes=body.note;delete body.note}
const x=await request(fault==='wrong-url'?'/api/note':'/api/notes','POST',body,fault==='no-session'?'omit':'same-origin');if(!x.r.ok){status(`${x.r.status} · ${x.data.error.message}`,true);return}const trace=JSON.stringify(x.trace,null,2);await load(x.data.id);$('#trace').textContent=trace;dirty=false;$('#dirty').textContent='已保存';status('记录已保存，可从列表重新打开。')
}catch(e){status('无法确认保存结果。请查看请求记录后再决定是否重试。',true)}finally{busy=false;$('#save').disabled=false}};
$('#reset').onclick=async()=>{if(!confirm('Reset this workspace and discard its changes?'))return;try{await request('/api/reset','POST',{});$('#fault').value='normal';$('#form').reset();dirty=false;$('#dirty').textContent='尚未提交';await load();status('工作区已重置')}catch(e){status(e.message,true)}};
$('#send').onclick=async()=>{const b=$('#send');b.disabled=true;try{const path=$('#path').value;if(!/^\/api\/notes(?:\/[A-Za-z0-9-]+|\?limit=\d+)?$/.test(path))throw Error('Use /api/notes or a note detail path.');const x=await request(path,$('#method').value,$('#method').value==='POST'?JSON.parse($('#api-body').value):undefined);$('#api-result').textContent=JSON.stringify(x.trace,null,2)}catch(e){$('#api-result').textContent=e.message}finally{b.disabled=false}};
$('#logs').onclick=async()=>{try{const x=await request('/api/logs');$('#log-result').textContent=JSON.stringify(x.data,null,2)}catch(e){$('#log-result').textContent=e.message}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});load().catch(e=>status(e.message,true));
</script></html>
