<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPC 用户增长 · 一页行动计划</title>
<style>
:root{--paper:#fff1e7;--ink:#10162f;--mark:#FFDE59;--line:#10162f;--white:#fff;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans SC Variable","PingFang SC",system-ui,sans-serif;font-size:18px;line-height:1.6}main{max-width:920px;margin:36px auto;padding:0 22px 60px}header{display:flex;gap:20px;align-items:center;border-bottom:2px solid var(--line);padding-bottom:20px}header img{width:130px;height:auto}h1{margin:0;font-size:30px;line-height:1.3}p{margin:12px 0}form{display:grid;gap:20px;margin-top:26px}label{display:grid;gap:8px;font-weight:700}textarea{font:inherit;line-height:1.5;width:100%;min-height:96px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);color:var(--ink);resize:vertical}textarea:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}button{font:inherit;padding:10px 18px;background:var(--mark);color:var(--ink);border:2px solid var(--line);border-radius:12px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}.secondary{background:var(--white)}#status{min-height:29px}small{font-size:15px;font-weight:400}.error{color:#b21c31}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}h1{font-size:26px}main{margin-top:22px}}@media print{@page{size:A4;margin:12mm}body{background:white;font-size:11pt}main{margin:0;padding:0;max-width:none}header img{width:85px}h1{font-size:20pt}.actions,#status,.intro{display:none}form{gap:9px;margin-top:12px}label{break-inside:avoid}textarea{min-height:55px;resize:none;border-radius:8px;padding:7px;font-size:10pt}small{font-size:9pt}}
</style></head><body><main>
<header><img src="logo-zh-full.svg" alt="JR Academy"><div><h1>用户增长 · 一页行动计划</h1><p>OPC W11 · 选一个方法，做一个真实动作</p></div></header>
<p class="intro">用自己的项目填写。未知写待测，目标写假设。草稿仅保存在当前浏览器，不上传。</p>
<form id="plan">
<label>1. 客户、首次价值与四步增长飞轮<textarea name="customer" placeholder="谁需要？怎样获值？本轮产生什么输出，如何接回下一轮客户？写四步与回流箭头。"></textarea></label>
<label>2. 飞轮哪条箭头卡住？证据是什么<textarea name="evidence" placeholder="写真实人数、时间窗口或客户原话；缺什么证据，怎样补？"></textarea></label>
<label>3. 借鉴哪个案例？候选方法与最终选择<textarea name="choice" placeholder="选Dropbox / Canva / Notion / Zapier中的相关机制，写前提差异；再选一个方法，说明排除另一项的理由。"></textarea></label>
<label>4. 本周最小动作与用户下一步<textarea name="action" placeholder="一个主要改动，针对同一类客户；不同时铺多个渠道。"></textarea></label>
<label>5. 指标、护栏与成本上限<textarea name="metric" placeholder="事件、分子/分母、窗口；最大现金投入和工时。"></textarea></label>
<label>6. 复盘时间与判断规则<textarea name="review" placeholder="何时读数？什么情况下保留、调整、停止？数据不足怎么办？"></textarea></label>
</form>
<div class="actions"><button id="save" type="button" disabled>保存本机草稿</button><button id="print" class="secondary" type="button">打印 / 另存 PDF</button><button id="clear" class="secondary" type="button">清空填写</button></div>
<p id="status" role="status" aria-live="polite">尚未填写。</p>
<small>课后补回真实结果、成本、其他解释和下一步，写回同一 Business SoT。拟稿不算发送，意向不算付费。</small>
</main><script>
const form=document.getElementById('plan'),status=document.getElementById('status'),save=document.getElementById('save');
const key='opc-w11-growth-plan-v1';
const fields=[...form.querySelectorAll('textarea')];
const setStatus=(text,error=false)=>{status.textContent=text;status.className=error?'error':'';};
try{const stored=localStorage.getItem(key);if(stored){const draft=JSON.parse(stored);fields.forEach(f=>{if(typeof draft[f.name]==='string')f.value=draft[f.name];});setStatus('已恢复本机草稿。');}}catch(e){setStatus('无法恢复草稿，请直接填写并使用打印保存。',true);}
form.addEventListener('input',()=>{save.disabled=!fields.some(f=>f.value.trim());setStatus('有未保存的修改。');});
save.addEventListener('click',()=>{try{const draft=Object.fromEntries(fields.map(f=>[f.name,f.value]));localStorage.setItem(key,JSON.stringify(draft));save.disabled=true;setStatus('已保存到当前浏览器。');}catch(e){setStatus('本机保存失败，请使用打印 / 另存 PDF 保留填写。',true);}});
document.getElementById('clear').addEventListener('click',()=>{if(!confirm('清空当前填写和这份本机草稿？'))return;fields.forEach(f=>f.value='');try{localStorage.removeItem(key);setStatus('已清空。');}catch(e){setStatus('填写已清空，本机旧草稿未删除，请检查浏览器存储权限。',true);}save.disabled=true;});
document.getElementById('print').addEventListener('click',()=>window.print());
</script></body></html>
