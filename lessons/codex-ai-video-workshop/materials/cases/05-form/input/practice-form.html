<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop registration</title><link rel="stylesheet" href="../../../assets/jr-craft.css"><style>body{margin:0;background:var(--jc-canvas);color:var(--jc-ink);font:16px/1.8 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:40px 24px 80px}h1{font-size:clamp(30px,5vw,48px);line-height:1.2}h2{font-size:26px;margin-top:36px}h3{font-size:20px}a{color:var(--jc-sky-deep);text-underline-offset:3px}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--jc-focus);outline-offset:3px}.eyebrow{font-weight:700;color:var(--jc-coral-deep)}section,.card{background:var(--jc-canvas-pure);border:1px solid var(--jc-hairline);border-radius:var(--jc-r-card);padding:24px;margin:18px 0;box-shadow:var(--jc-shadow-card)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid .card{margin:0}nav{display:flex;gap:18px;flex-wrap:wrap}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:12px;vertical-align:top;border-bottom:1px solid var(--jc-hairline)}th{background:var(--jc-surface)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--jc-night);color:var(--jc-on-night);padding:20px;border-radius:var(--jc-r-input);font:14px/1.7 ui-monospace,monospace}.note{color:var(--jc-slate)}img{max-width:100%;height:auto}input,select{font:inherit;padding:10px;border:1px solid var(--jc-slate);border-radius:var(--jc-r-input);max-width:100%;box-sizing:border-box}label{display:block;margin:15px 0}button{font:inherit;padding:10px 20px;border:0;border-radius:var(--jc-r-pill);background:var(--jc-primary);color:var(--jc-on-primary);cursor:pointer}button.secondary{background:var(--jc-night);color:var(--jc-on-night)}button:disabled{opacity:.55;cursor:not-allowed}audio{max-width:100%}@media(max-width:740px){main{padding:24px 16px 60px}.grid{grid-template-columns:1fr}section,.card{padding:18px}h2{font-size:23px}}@page{size:A4;margin:18mm}@media print{main{padding:0}body{font-size:10.5pt}.grid{display:block}section,.card{box-shadow:none}pre{background:#f3f3f3;color:#17142a;font-size:9pt}h1{font-size:26pt}tr{break-inside:avoid}}form{max-width:680px}label input:not([type=checkbox]),label select{display:block;width:100%}input[type=checkbox]{width:auto}</style>
</head><body><main><p class="eyebrow">虚构报名练习 · 内容仅在本页面预览</p><h1>Workshop registration</h1><form id="practice"><label>Name <input name="full_name" required></label><label>Email <input type="email" name="email" required></label><label>Company <input name="company" required></label><label>Session <select name="session"><option value="">Select a session</option><option>Morning</option><option>Afternoon</option></select></label><label>Attendees <input name="attendees" type="number" min="1" max="4" required></label><label>Dietary notes (optional) <input name="dietary_notes"></label><label><input type="checkbox" name="consent" required> I agree to preview this fictional submission</label><button type="submit">预览填写结果</button> <button type="reset" class="secondary">清空练习</button></form><section id="preview" hidden aria-live="polite"></section><script>const f=document.querySelector('form'),p=document.querySelector('#preview');f.addEventListener('submit',e=>{e.preventDefault();p.hidden=false;p.replaceChildren();const h=document.createElement('h2');h.textContent='填写结果（未发送）';p.append(h);for(const [k,v] of new FormData(f)){const r=document.createElement('p');r.textContent=k+': '+(v||'未提供');p.append(r)}const n=document.createElement('p');n.textContent='没有产生真实报名记录。';p.append(n)});f.addEventListener('reset',()=>{p.hidden=true;p.replaceChildren()});</script></main></body></html>
