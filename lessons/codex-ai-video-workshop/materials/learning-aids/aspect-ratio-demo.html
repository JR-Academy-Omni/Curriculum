<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>同一画面，怎样放进竖屏？</title><link rel="stylesheet" href="../assets/jr-craft.css"><style>body{margin:0;background:var(--jc-canvas);color:var(--jc-ink);font:16px/1.8 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:40px 24px 80px}h1{font-size:clamp(30px,5vw,48px);line-height:1.2}h2{font-size:26px;margin-top:36px}h3{font-size:20px}a{color:var(--jc-sky-deep);text-underline-offset:3px}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--jc-focus);outline-offset:3px}.eyebrow{font-weight:700;color:var(--jc-coral-deep)}section,.card{background:var(--jc-canvas-pure);border:1px solid var(--jc-hairline);border-radius:var(--jc-r-card);padding:24px;margin:18px 0;box-shadow:var(--jc-shadow-card)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid .card{margin:0}nav{display:flex;gap:18px;flex-wrap:wrap}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:12px;vertical-align:top;border-bottom:1px solid var(--jc-hairline)}th{background:var(--jc-surface)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--jc-night);color:var(--jc-on-night);padding:20px;border-radius:var(--jc-r-input);font:14px/1.7 ui-monospace,monospace}.note{color:var(--jc-slate)}img{max-width:100%;height:auto}input,select{font:inherit;padding:10px;border:1px solid var(--jc-slate);border-radius:var(--jc-r-input);max-width:100%;box-sizing:border-box}label{display:block;margin:15px 0}button{font:inherit;padding:10px 20px;border:0;border-radius:var(--jc-r-pill);background:var(--jc-primary);color:var(--jc-on-primary);cursor:pointer}button.secondary{background:var(--jc-night);color:var(--jc-on-night)}button:disabled{opacity:.55;cursor:not-allowed}audio{max-width:100%}@media(max-width:740px){main{padding:24px 16px 60px}.grid{grid-template-columns:1fr}section,.card{padding:18px}h2{font-size:23px}}@page{size:A4;margin:18mm}@media print{main{padding:0}body{font-size:10.5pt}.grid{display:block}section,.card{box-shadow:none}pre{background:#f3f3f3;color:#17142a;font-size:9pt}h1{font-size:26pt}tr{break-inside:avoid}}article{max-width:900px}article p{margin:16px 0}article h2{border-top:1px solid var(--jc-hairline);padding-top:26px}article h3{margin-top:28px}blockquote{margin:20px 0;padding:16px 24px;border-left:4px solid var(--jc-coral);background:var(--jc-surface)}.toc{columns:2;column-gap:28px}.toc li{break-inside:avoid;margin:8px 0}.jump{position:sticky;top:0;background:var(--jc-canvas);padding:12px 0;z-index:2;border-bottom:1px solid var(--jc-hairline)}@media(max-width:740px){.toc{columns:1}.jump{position:static}}@media print{.jump,.toc{display:none}a{color:inherit}}</style><meta name="googlebot" content="noindex,nofollow"></head><body><main><p class="eyebrow">宽高比教学图解</p><h1>同一画面，怎样放进竖屏？</h1><p>选择一种方式，观察圆形和两侧物件。保持比例时，圆不会变成椭圆。</p><nav><button data-mode="contain">完整显示</button><button data-mode="cover">铺满裁切</button><button data-mode="fill" class="secondary">拉伸对比</button></nav><section><p id="explanation" aria-live="polite"></p><div id="viewport" style="width:270px;height:480px;max-width:100%;margin:24px auto;background:var(--jc-surface-soft);position:relative;overflow:hidden;border:2px solid var(--jc-ink)"><div id="source" style="width:480px;height:270px;position:absolute;left:50%;top:50%;transform-origin:center;background:var(--jc-wash-sky);display:flex;align-items:center;justify-content:space-around"><div style="width:70px;height:110px;background:var(--jc-coral);border:2px solid var(--jc-ink)"></div><div style="width:120px;height:120px;border-radius:50%;background:var(--jc-mint);border:2px solid var(--jc-ink)"></div><div style="width:70px;height:110px;background:var(--jc-sunshine);border:2px solid var(--jc-ink)"></div></div></div><p>源画面 16:9；目标画布 9:16。颜色与物件仅用于说明几何关系。</p></section><p><a href="../视频示范脚本与分镜.html">回到完整脚本与分镜</a></p><script>const v=document.querySelector('#viewport'),s=document.querySelector('#source'),e=document.querySelector('#explanation');let current='contain';const texts={contain:'完整显示：所有物件保留，上下留下空区。',cover:'铺满裁切：保持比例，两侧部分超出可见区域；圆仍然是圆。',fill:'拉伸对比：横纵缩放不同，圆变成椭圆；不是默认推荐做法。'};function show(mode){current=mode;const x=v.clientWidth/480,y=v.clientHeight/270;let sx=x,sy=y;if(mode!=='fill')sx=sy=mode==='contain'?Math.min(x,y):Math.max(x,y);s.style.transform='translate(-50%,-50%) scale('+sx+','+sy+')';e.textContent=texts[mode];for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.mode===mode));}for(const b of document.querySelectorAll('button'))b.onclick=()=>show(b.dataset.mode);window.addEventListener('resize',()=>show(current));show(current);</script></main></body></html>
