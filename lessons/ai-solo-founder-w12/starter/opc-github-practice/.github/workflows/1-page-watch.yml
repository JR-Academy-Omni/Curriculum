name: 1 · 页面监控（不用 AI）

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时一次（UTC）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 抓页面，存快照
        run: python3 scripts/snapshot.py
      - name: 有变化才开 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add watch/snapshots
          if git diff --cached --quiet; then echo "无变化，安静退出"; exit 0; fi
          CHANGED=$(git diff --cached --diff-filter=M --name-only)
          git diff --cached --diff-filter=M > /tmp/diff.txt || true
          git config user.name "opc-bot"; git config user.email "opc-bot@users.noreply.github.com"
          git commit -m "页面快照 $(date -u +%F)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          if [ -z "$CHANGED" ]; then echo "第一次运行，只建快照"; exit 0; fi
          { echo "这些页面和上次不一样："; echo; echo "$CHANGED"; echo; echo '```diff'; head -c 50000 /tmp/diff.txt; echo; echo '```'; } > /tmp/body.md
          gh issue create --title "页面有变化 $(date -u +%F)" --body-file /tmp/body.md
